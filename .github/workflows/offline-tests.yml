name: Detection Configuration And Offline Triage

on:
  push:
  pull_request:

jobs:
  regression:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -S -m anlan validate -o output/validation.json
      - run: python -m unittest discover -s tests -v
      - run: python -S -m anlan demo
      - name: Check shell and lab template without starting services
        if: runner.os == 'Linux'
        run: |
          bash -n scripts/setup.sh
          bash -n scripts/test-rules.sh
          docker compose config --quiet
      - uses: actions/upload-artifact@v4
        with:
          name: offline-evidence-${{ matrix.os }}-${{ matrix.python }}
          path: output/
